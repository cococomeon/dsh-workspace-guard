# dsh-workspace-guard bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field), activate with
# `dsh plugin --profile <name> add link:~/Documents/deepseek-harness/default-workspace/dsh-workspace-guard`.
#
# The row is a bare host-only plugin by package name: the host half (exports ".")
# runs in the host process, registering the workspace_guard_* agent tools and
# opening its own `workspace-guard` storage domain. There is no browser half —
# the plugin answers model/API questions and renders no UI, so package.json
# declares no `dsh.client`.
- insert:
    - id: workspace-guard
      name: dsh-workspace-guard
